name: Weekly Bank of England refresh

on:
  schedule:
    - cron: "0 7 * * 1"   # Mondays 07:00 UTC (07:00 UK time in winter, 08:00 in summer)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch feeds and rebuild taxonomy, llms.txt, Word doc and digest
        run: python scripts/build.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes this week."
          else
            git commit -m "Weekly refresh: $(TZ=Europe/London date +%Y-%m-%d)"
            git push
          fi

      - name: Job summary
        if: always()
        run: |
          if [ -f weekly/latest.md ]; then cat weekly/latest.md >> "$GITHUB_STEP_SUMMARY"; fi
